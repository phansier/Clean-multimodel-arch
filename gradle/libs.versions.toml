[versions]
kotlin = "2.1.0"
agp = "8.7.3"
dagger = "2.53.1"
moxy = "2.2.2"
coroutines = "1.9.0"
navigation = "2.8.5"
appcompat = "1.7.0"
material = "1.12.0"
constraint = "2.2.0"
serialization = "1.7.3"

[libraries]
kotlinGradle = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kaptGradle = { module = "org.jetbrains.kotlin.kapt:org.jetbrains.kotlin.kapt.gradle.plugin", version.ref = "kotlin" }
kotlinSerialization = { module = "org.jetbrains.kotlin.plugin.serialization:org.jetbrains.kotlin.plugin.serialization.gradle.plugin", version.ref = "kotlin" }
androidGradle = { module = "com.android.tools.build:gradle", version.ref = "agp" }

daggerCompiler = { module = "com.google.dagger:dagger-compiler", version.ref = "dagger" }
moxyCompiler = { module = "com.github.moxy-community:moxy-compiler", version.ref = "moxy" }

dagger = { module = "com.google.dagger:dagger", version.ref = "dagger" }

coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

moxy = { module = "com.github.moxy-community:moxy", version.ref = "moxy" }
moxyAndroid = { module = "com.github.moxy-community:moxy-androidx", version.ref = "moxy" }
moxyKtx = { module = "com.github.moxy-community:moxy-ktx", version.ref = "moxy" }

navigation = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigation" }
kotlin-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }


androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-constraint = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraint" }

material = { module = "com.google.android.material:material", version.ref = "material" }